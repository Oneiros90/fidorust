[workspace]
resolver = "2"
members = [
    "crates/fidorust-core",
    "crates/fidorust-gpu",
    "crates/fidorust-wasm",
    "apps/ui/src-tauri",
]
default-members = ["crates/fidorust-core", "crates/fidorust-gpu"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.4"
repository = "https://github.com/Oneiros90/fidorust"

[workspace.dependencies]
fidorust-core = { path = "crates/fidorust-core" }
fidorust-gpu = { path = "crates/fidorust-gpu" }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
glow = "0.16"
bytemuck = { version = "1", features = ["derive"] }
lyon = "1"
ttf-parser = "0.25"
