name: Pages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/bump.mjs "${{ github.ref_name }}" --files-only

      - name: Build web
        working-directory: apps/ui
        run: |
          npm run wasm
          npx vite build --base /${{ github.event.repository.name }}/
          touch dist/.nojekyll

      - name: Stage encrypted Pro modules from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/stage-pro-modules.sh apps/ui/dist/pro

      - name: Note missing module for this app version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/ui/package.json').version")"
          DAT="apps/ui/dist/pro/${VERSION}/fidorust-pro.dat"
          if [ ! -f "$DAT" ]; then
            echo "::warning::No Pro module for ${VERSION} yet. Site deploys anyway; activation 404s until fidorust-pro ships ${VERSION}."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/ui/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
